services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: adl
      POSTGRES_PASSWORD: adl_dev
      POSTGRES_DB: adl
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adl"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: adl_test
    ports:
      - "5433:5432"
    volumes:
      - pgdata-test:/var/lib/postgresql/data

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000:8000"
    # For local dev with hot-reload, add --reload to the uvicorn command.
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ./src:/app/src
      - ./rules:/app/rules
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      # Should match the URL users use to reach the backend in their browser.
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
    depends_on:
      - web

volumes:
  pgdata:
  pgdata-test:
