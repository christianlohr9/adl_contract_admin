services:
  - type: web
    name: adl-api
    runtime: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MFL_LEAGUE_ID
        value: "60206"
      - key: MFL_YEAR
        value: "2026"
      - key: MFL_API_KEY
        sync: false
      - key: MFL_USERNAME
        sync: false
      - key: MFL_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: adl-frontend
    runtime: static
    rootDir: frontend
    buildCommand: pnpm install && pnpm build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
